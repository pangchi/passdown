<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Shift Passdown{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header>
        <h1><a href="{{ url_for('index') }}">Shift Passdown</a></h1>
        <nav>
            <a href="{{ url_for('user_guide') }}">User guide</a>
            <a href="{{ url_for('manage_names') }}">Manage names</a>
            <a href="{{ url_for('manage_categories') }}">Manage categories</a>
        </nav>
    </header>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            <div class="flash-container">
                {% for category, message in messages %}
                    <div class="flash flash-{{ category }}">{{ message }}</div>
                {% endfor %}
            </div>
        {% endif %}
    {% endwith %}

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer>
        <span id="build-date" data-build-date="{{ app_started_at }}" data-version="v{{ app_version }}"></span>
    </footer>

    <script src="{{ url_for('static', filename='attachments.js') }}"></script>
    <script src="{{ url_for('static', filename='namepicker.js') }}"></script>
    <script src="{{ url_for('static', filename='mentions.js') }}"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            var el = document.getElementById('build-date');
            if (!el || !el.dataset.buildDate) return;
            var d = new Date(el.dataset.buildDate);
            var pad = function (n) { return String(n).padStart(2, '0'); };
            var version = el.dataset.version ? el.dataset.version + ' — ' : '';
            el.textContent = version + 'Build: ' + d.toLocaleDateString(undefined, {
                day: '2-digit', month: 'short', year: 'numeric'
            }) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
        });
    </script>
</body>
</html>
